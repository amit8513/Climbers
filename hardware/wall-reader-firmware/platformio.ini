; Phase 1.25 hardware spike - wall-mounted NFC reader firmware.
; See ../../NEXT_STEPS.md and ../../docs/ROUTE_ATTRIBUTION_PLAN.md for the
; project context this firmware belongs to, and docs/ in this directory for
; wiring, build/flash, and the physical test protocol.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PN532@^1.3.3
    adafruit/Adafruit BusIO@^1.16.1
build_flags =
    -DWALLREADER_PRODUCTION_MODE=0

; Example of a second physical reader sharing this same firmware source but
